<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DBBroker · Bases activas</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">DBBROKER</p>
        <h1>Bases activas</h1>
        <p class="subtitle">PostgreSQL aislado por worktree</p>
      </div>
      <button id="refresh" class="refresh" type="button" aria-label="Actualizar bases activas">Actualizar</button>
    </header>

    <section class="summary" aria-live="polite">
      <div class="metric">
        <span id="count" class="metric-value">—</span>
        <span class="metric-label">DB activas</span>
      </div>
      <div class="connection">
        <span id="status-dot" class="status-dot"></span>
        <span id="status">Conectando…</span>
      </div>
      <time id="updated" class="updated"></time>
    </section>

    <section aria-labelledby="active-title">
      <div class="section-heading">
        <h2 id="active-title">Worktrees conectados</h2>
        <span>Actualización automática cada 5 s</span>
      </div>
      <div id="assignments" class="assignments" aria-live="polite" aria-busy="true"></div>
    </section>
  </main>

  <template id="assignment-template">
    <article class="assignment-card">
      <div class="card-topline">
        <span class="live-pill"><span></span>Activa</span>
        <span class="template"></span>
      </div>
      <h3 class="database"></h3>
      <dl>
        <div><dt>Proyecto</dt><dd class="repository"></dd></div>
        <div><dt>Worktree</dt><dd class="worktree"></dd></div>
        <div><dt>Último heartbeat</dt><dd class="heartbeat"></dd></div>
        <div><dt>Creada</dt><dd class="created"></dd></div>
      </dl>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
