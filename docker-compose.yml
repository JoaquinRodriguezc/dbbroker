services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dbbroker
      POSTGRES_PASSWORD: dbbroker
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbbroker -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dbbroker"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "dbbroker", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker:
    build: .
    environment:
      DBBROKER_LISTEN: ":8080"
      DBBROKER_DATABASE_URL: "postgres://dbbroker:dbbroker@postgres:5432/postgres?sslmode=disable"
      DBBROKER_PUBLIC_DATABASE_URL: "postgres://dbbroker:dbbroker@127.0.0.1:54329/postgres?sslmode=disable"
      DBBROKER_REDIS_URL: "redis://:dbbroker@redis:6379/0"
      DBBROKER_PUBLIC_REDIS_URL: "redis://127.0.0.1:56379/0"
      DBBROKER_TOKEN: ""
      DBBROKER_LEASE_TTL: "${DBBROKER_LEASE_TTL:-15m}"
      DBBROKER_GC_INTERVAL: "${DBBROKER_GC_INTERVAL:-1m}"
    ports:
      - "127.0.0.1:8787:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
